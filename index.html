<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c4e73">
<title>J2CP Mobile</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{--navy:#1c4e73;--ice:#2f8fc9;--bg:#f1f5f8;--surface:#fff;--line:#d3dde6;--ink:#13263a;--muted:#56687a;--ok:#22764a;--okbg:#e3f2ea;--warn:#a96200;--warnbg:#fbf0dd;--bad:#b0281f;--badbg:#fbe5e3;--sunk:#e8eef3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;min-height:40px}
main{padding:14px max(14px,env(safe-area-inset-right,0px)) calc(90px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:12px}
.bar.ok{background:var(--okbg);color:var(--ok)}.bar.warn{background:var(--warnbg);color:var(--warn)}.bar.bad{background:var(--badbg);color:var(--bad)}
.bar button{margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid var(--sunk);text-decoration:none;color:inherit;min-height:56px}
.item:first-child{border-top:0}
.item .t{font-weight:650}.item .s{font-size:13px;color:var(--muted)}
.item .grow{flex:1;min-width:0}.item .grow>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;font-weight:700;border-radius:12px;padding:3px 9px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.blue{background:#e3eff8;color:var(--navy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-size:15px;min-height:44px;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;margin-bottom:12px;font-size:13px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{margin-top:4px;color:var(--ink);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 12px;font:inherit;font-size:14px;min-height:40px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.search{position:sticky;top:64px;z-index:4;margin:-4px 0 12px}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6}
.room{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw}
.lines{font-size:14px;margin:6px 0 0;padding-left:18px;color:var(--muted)}
a{color:var(--navy)}
</style>
</head>
<body>
<header><button id="hb" hidden aria-label="Retour">←</button><h1 id="ht">J2CP</h1><button id="hs" aria-label="Synchroniser">↻ Synchro</button></header>
<main id="app"></main>
<script>
"use strict";
const CFG={clientId:"787091855800-n8aop6hc5p97cv5bhirp65al0apj7j0n.apps.googleusercontent.com",scope:"https://www.googleapis.com/auth/drive",dataFolder:"Sauvegarde base de données facturation",mobile:"J2CP Mobile"};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fdate=s=>{if(!s)return "";const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);return m?m[3]+"/"+m[2]+"/"+m[1]:s};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ---------- stockage local (IndexedDB) ---------- */
const DB=new Promise((res,rej)=>{const r=indexedDB.open("j2cp-mobile",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("kv");d.createObjectStore("out",{keyPath:"id"});d.createObjectStore("pdf")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(st,mode,fn)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction(st,mode);const s=t.objectStore(st);let out;Promise.resolve(fn(s)).then(v=>{out=v});t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})};
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvGet=k=>tx("kv","readonly",s=>req(s.get(k)));
const kvSet=(k,v)=>tx("kv","readwrite",s=>{s.put(v,k)});
const outAll=()=>tx("out","readonly",s=>req(s.getAll()));
const outPut=v=>tx("out","readwrite",s=>{s.put(v)});
const outDel=id=>tx("out","readwrite",s=>{s.delete(id)});
const pdfGet=k=>tx("pdf","readonly",s=>req(s.get(k)));
const pdfSet=(k,v)=>tx("pdf","readwrite",s=>{s.put(v,k)});

/* ---------- état ---------- */
let DATA=null,META=null,OUT=[];
const clients=()=>DATA?Object.values(DATA).filter(x=>x&&x.t==="client"):[];
const docsOf=id=>DATA?Object.values(DATA).filter(x=>x&&x.t==="doc"&&x.clientId===id).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))):[];
function clientView(id){const base=(DATA&&DATA[id])||null;let c=base?{...base}:null;
  OUT.filter(o=>o.clientId===id&&o.kind==="client").sort((a,b)=>a.at-b.at).forEach(o=>{c={...(c||{id,t:"client"}),...o.data}});return c}
function allClients(){const m={};clients().forEach(c=>m[c.id]=c);OUT.filter(o=>o.kind==="client").forEach(o=>{m[o.clientId]=clientView(o.clientId)});return Object.values(m)}
function ctName(c){const p=String(c.prenom||"").trim(),n=String(c.nom||"").trim();return (p||n)?[p,n].filter(Boolean).join(" "):cName(c)}
function ctAddr(c){return [c.address,[c.zip,c.city].filter(Boolean).join(" ")].filter(Boolean).join(", ")}
function isAndroid(){return /Android/i.test(navigator.userAgent)}
function contactHref(c){if(!isAndroid())return "#vcf";const e=encodeURIComponent,x=[["name",ctName(c)],["phone",c.phone],["secondary_phone",c.phone2],["email",c.email],["postal",ctAddr(c)],["notes","Client J2CP"]].filter(([,v])=>v&&String(v).trim());
  return "intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/raw_contact;"+x.map(([k,v])=>"S."+k+"="+e(String(v).trim())).join(";")+";end"}
function vcard(c){const q=v=>String(v||"").replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\n/g,"\\n");
  const L=["BEGIN:VCARD","VERSION:3.0","N:"+q(c.nom)+";"+q(c.prenom)+";;;","FN:"+q(ctName(c))];if(c.phone)L.push("TEL;TYPE=CELL:"+q(c.phone));if(c.phone2)L.push("TEL;TYPE=VOICE:"+q(c.phone2));if(c.email)L.push("EMAIL:"+q(c.email));
  if(c.address||c.city)L.push("ADR;TYPE=HOME:;;"+q(c.address)+";"+q(c.city)+";;"+q(c.zip)+";France");L.push("NOTE:Client J2CP","END:VCARD");return L.join("\r\n")}
function cSortKey(c){if(!c)return "";const n=(c.nom||"").trim(),p=(c.prenom||"").trim();return (n?n+" "+p:(c.name||p||"")).trim()}
function cName(c){if(!c)return "";if(c.civ==="M. et Mme"){const N=(c.nom||"").toUpperCase(),N2=(c.nom2||"").toUpperCase();if(!N2||N2===N)return ["M. et Mme",[c.prenom,c.prenom2].filter(Boolean).join(" et "),N].filter(Boolean).join(" ");return "M. "+[c.prenom,N].filter(Boolean).join(" ")+" et Mme "+[c.prenom2,N2].filter(Boolean).join(" ")}
  if(c.nom||c.prenom)return [c.civ,c.prenom,(c.nom||"").toUpperCase()].filter(Boolean).join(" ");return c.name||"(sans nom)"}
function dirName(c){if(!c)return "";let n;if(c.type==="pro"&&c.name)n=c.name.trim();else n=[(c.nom||"").toUpperCase(),c.prenom].filter(Boolean).join(" ").trim()||(c.name||"").trim();
  return n.replace(/[<>:"/\\|?*\x00-\x1f]/g,"-").split(/\s+/).filter(Boolean).join(" ").replace(/^[ .]+|[ .]+$/g,"")}
const TYPE={devis:"Devis",facture:"Facture",acompte:"Facture d'acompte",avoir:"Avoir"};
const STATUS={brouillon:["Brouillon",""],envoye:["Envoyé","warn"],accepte:["Accepté","ok"],oral:["Accord oral","ok"],refuse:["Refusé","bad"],emise:["Émise","blue"],payee:["Réglée","ok"]};

/* ---------- Google ---------- */
let TOK=null,TOKEXP=0;
function getToken(){return new Promise((res,rej)=>{if(TOK&&Date.now()<TOKEXP-60000)return res(TOK);
  if(!(window.google&&google.accounts&&google.accounts.oauth2))return rej(new Error("Google est injoignable (pas de réseau ?)"));
  const tc=google.accounts.oauth2.initTokenClient({client_id:CFG.clientId,scope:CFG.scope,hint:localStorage.getItem("j2cp_hint")||undefined,
    callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));TOK=r.access_token;TOKEXP=Date.now()+(+r.expires_in||3600)*1000;res(TOK)},
    error_callback:e=>rej(new Error(e&&e.type==="popup_closed"?"Connexion annulée":"Connexion Google impossible"))});
  tc.requestAccessToken({prompt:localStorage.getItem("j2cp_ok")?"":"consent"})})}
async function G(path,opt={}){const url=path.startsWith("http")?path:"https://www.googleapis.com/drive/v3/"+path;
  const r=await fetch(url,{...opt,headers:{Authorization:"Bearer "+TOK,...(opt.headers||{})}});
  if(r.status===401){TOK=null;throw new Error("Session Google expirée : touche Synchro")}
  if(!r.ok)throw new Error("Drive "+r.status+" : "+(await r.text()).slice(0,160));return r}
const qe=s=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
async function Q(q,fields="files(id,name,mimeType,modifiedTime,parents,webViewLink,size)"){let out=[],pt="";
  do{const r=await G("files?q="+encodeURIComponent(q)+"&fields="+encodeURIComponent("nextPageToken,"+fields)+"&pageSize=1000&spaces=drive&includeItemsFromAllDrives=true&supportsAllDrives=true"+(pt?"&pageToken="+pt:""));const j=await r.json();out=out.concat(j.files||[]);pt=j.nextPageToken||""}while(pt);return out}
async function ensureFolder(name,parent){const f=await Q(`name='${qe(name)}' and mimeType='application/vnd.google-apps.folder' and trashed=false and '${parent}' in parents`);if(f.length)return f[0].id;
  const r=await G("files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,mimeType:"application/vnd.google-apps.folder",parents:[parent]})});return (await r.json()).id}
async function upload(name,parent,blob){const fd=new FormData();fd.append("metadata",new Blob([JSON.stringify({name,parents:[parent]})],{type:"application/json"}));fd.append("file",blob);
  const r=await G("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",body:fd});return (await r.json()).id}

/* ---------- synchronisation ---------- */
let SYNCING=false;
async function sync(){if(SYNCING)return;SYNCING=true;setBar();
  try{await getToken();localStorage.setItem("j2cp_ok","1");
    // 1. envoyer ce qui attend
    OUT=await outAll();
    if(OUT.length){const root=await ensureFolder(CFG.mobile,"root");const inbox=await ensureFolder("inbox",root);const ph=await ensureFolder("photos",root);
      for(const o of OUT.sort((a,b)=>a.at-b.at)){const names=[];
        for(const [i,p] of (o.photos||[]).entries()){const n=o.id+"_"+(i+1)+".jpg";if(!p.up){await upload(n,ph,p.blob);p.up=1;await outPut(o)}names.push(n)}
        const msg={v:1,kind:o.kind,id:o.id,at:o.at,clientId:o.clientId,clientDir:o.clientDir||"",data:o.data||{},photos:names,note:o.note||""};
        await upload(o.id+".json",inbox,new Blob([JSON.stringify(msg)],{type:"application/json"}));await outDel(o.id)}
      OUT=await outAll()}
    // 2. récupérer les données à jour
    const folders=await Q(`name='${qe(CFG.dataFolder)}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    let best=null;for(const f of folders){const fs=await Q(`name='donnees.json' and '${f.id}' in parents and trashed=false`);fs.forEach(x=>{if(!best||x.modifiedTime>best.modifiedTime)best=x})}
    if(!best)throw new Error("donnees.json introuvable dans « "+CFG.dataFolder+" »");
    if(!META||META.modifiedTime!==best.modifiedTime||!DATA){const j=await (await G("files/"+best.id+"?alt=media")).json();DATA=j.docs||{};await kvSet("data",DATA)}
    META={modifiedTime:best.modifiedTime,syncedAt:Date.now()};await kvSet("meta",META);
    toast(OUT.length?"Synchro partielle":"Synchronisé ✓")}
  catch(e){toast(e.message||String(e))}
  finally{SYNCING=false;route()}}

function setBar(){const b=$("#bar");if(!b)return;const n=OUT.length;
  if(SYNCING){b.className="bar warn";b.innerHTML="Synchronisation…";return}
  if(!DATA){b.className="bar bad";b.innerHTML=`Aucune donnée sur ce téléphone.<button class="btn primary" data-sync>Se connecter</button>`}
  else if(n){b.className="bar warn";b.innerHTML=`${n} envoi${n>1?"s":""} en attente${navigator.onLine?"":" · hors connexion"}<button class="btn" data-sync>Envoyer</button>`}
  else{b.className="bar ok";b.innerHTML=`À jour${META&&META.syncedAt?" · "+new Date(META.syncedAt).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):""}${navigator.onLine?"":" · hors connexion"}`}
  b.querySelectorAll("[data-sync]").forEach(x=>x.onclick=sync)}

/* ---------- écrans ---------- */
let back=null;
function head(title,b){$("#ht").textContent=title;const hb=$("#hb");hb.hidden=!b;back=b||null}
$("#hb").onclick=()=>{if(back)location.hash=back};
$("#hs").onclick=sync;
function route(){const h=location.hash.slice(1)||"/";const p=h.split("/").filter(Boolean);window.scrollTo(0,0);
  if(p[0]==="c"&&p[1]){const id=decodeURIComponent(p[1]);if(p[2]==="edit")return viewEdit(id);if(p[2]==="visite")return viewVisite(id);if(p[2]==="photos")return viewPhotos(id);return viewClient(id)}
  if(p[0]==="new")return viewEdit(null);return viewList()}
window.addEventListener("hashchange",route);
window.addEventListener("online",()=>{setBar();if(OUT.length&&TOK&&Date.now()<TOKEXP)sync()});window.addEventListener("offline",setBar);

function viewList(){head("J2CP · Clients");const L=allClients().sort((a,b)=>cSortKey(a).localeCompare(cSortKey(b),"fr",{sensitivity:"base"}));const q=sessionStorage.getItem("q")||"";
  $("#app").innerHTML=`<div id="bar" class="bar"></div>${DATA?`<div class="search"><input id="q" type="search" placeholder="Rechercher un client, une ville…" value="${esc(q)}" aria-label="Rechercher"></div><div class="list" id="L"></div>`:`<div class="card"><p style="margin-top:0">Connecte-toi à ton compte Google pour charger tes clients, devis et factures sur ce téléphone. Ensuite, tout reste consultable sans réseau.</p><button class="btn primary block" data-sync2>Se connecter à Google</button></div>`}
  <a class="btn primary fab" href="#/new">+ Prospect</a>`;
  setBar();const s2=document.querySelector("[data-sync2]");if(s2)s2.onclick=sync;
  if(!DATA)return;
  const draw=()=>{const t=$("#q").value.trim().toLowerCase();sessionStorage.setItem("q",$("#q").value);
    const F=L.filter(c=>!t||[cName(c),c.city,c.zip,c.phone,c.email,c.address].join(" ").toLowerCase().includes(t));
    $("#L").innerHTML=F.length?F.map(c=>{const n=docsOf(c.id).length;const pend=OUT.some(o=>o.clientId===c.id);return `<a class="item" href="#/c/${encodeURIComponent(c.id)}"><div class="grow"><div class="t">${esc(cName(c))}</div><div class="s">${esc([c.city,c.phone].filter(Boolean).join(" · "))}</div></div>${pend?'<span class="pill warn">à envoyer</span>':n?`<span class="pill">${n} doc.</span>`:""}</a>`}).join(""):`<div class="empty">Aucun client trouvé.</div>`};
  $("#q").oninput=draw;draw()}

function viewClient(id){const c=clientView(id);if(!c){location.hash="/";return}head(cName(c),"#/");
  const D=docsOf(id);const tel=[c.phone,c.phone2].filter(Boolean);const adr=[c.address,[c.zip,c.city].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  const vis=OUT.filter(o=>o.clientId===id&&o.kind!=="client");
  $("#app").innerHTML=`<div id="bar" class="bar"></div>
  <div class="card"><h2>Coordonnées</h2>
    ${adr?`<div style="margin-bottom:8px">${esc(adr)}<br><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(adr)}" target="_blank" rel="noopener">Itinéraire</a></div>`:""}
    ${tel.map(t=>`<div><a href="tel:${esc(t.replace(/\s/g,""))}">📞 ${esc(t)}</a></div>`).join("")}${c.email?`<div><a href="mailto:${esc(c.email)}">✉ ${esc(c.email)}</a></div>`:""}
    <div class="btns" style="margin-top:12px"><a class="btn" href="#/c/${encodeURIComponent(id)}/edit">Modifier la fiche</a><a class="btn" id="addct" href="${esc(contactHref(c))}">👤 Ajouter aux contacts</a></div></div>
  <div class="btns" style="margin-bottom:12px"><a class="btn primary" style="flex:1" href="#/c/${encodeURIComponent(id)}/visite">📝 Fiche de découverte</a><a class="btn primary" style="flex:1" href="#/c/${encodeURIComponent(id)}/photos">📷 Photos</a></div>
  ${vis.length?`<div class="card"><h2>En attente d'envoi</h2>${vis.map(o=>`<div class="s">${o.kind==="visite"?"Fiche de découverte":"Photos"} · ${new Date(o.at).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}${o.photos&&o.photos.length?" · "+o.photos.length+" photo(s)":""}</div>`).join("")}</div>`:""}
  <div class="card"><h2>Devis et factures</h2>${D.length?`<div class="list" style="border:0">${D.map(d=>{const st=STATUS[d.status]||[d.status||"",""];return `<div class="item" style="padding-left:0;padding-right:0;display:block"><div style="display:flex;gap:8px;align-items:center"><div class="grow"><div class="t">${esc((TYPE[d.type]||d.type)+" "+(d.number||"(brouillon)"))}</div><div class="s">${fdate(d.date)}</div></div>${st[0]?`<span class="pill ${st[1]}">${esc(st[0])}</span>`:""}</div>${(d.lines||[]).filter(l=>!l.text&&l.label).length?`<ul class="lines">${(d.lines||[]).filter(l=>!l.text&&l.label).slice(0,6).map(l=>`<li>${esc((l.qty&&+l.qty!==1?l.qty+" × ":"")+l.label)}</li>`).join("")}</ul>`:""}</div>`}).join("")}</div>`:`<p class="muted" style="margin:0">Aucun document.</p>`}</div>
  <div class="card"><h2>Fichiers (PDF, photos)</h2><div id="files"><p class="muted" style="margin:0">Chargement…</p></div></div>`;
  {const a=$("#addct");if(a&&!isAndroid())a.onclick=ev=>{ev.preventDefault();const u=URL.createObjectURL(new Blob([vcard(c)],{type:"text/vcard"}));const l=document.createElement("a");l.href=u;l.download=(ctName(c)||"contact").replace(/[\\/:*?"<>|]/g,"-")+".vcf";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}}
  setBar();loadFiles(c)}

async function loadFiles(c){const box=$("#files");const key="files:"+c.id;let L=await kvGet(key);
  const draw=(L,note)=>{if(!box.isConnected)return;box.innerHTML=(note?`<p class="muted" style="font-size:13px;margin:0 0 8px">${esc(note)}</p>`:"")+(note&&!(L&&L.length)?"":L&&L.length?L.map((f,i)=>`<div class="item" style="padding-left:0;padding-right:0"><div class="grow"><div class="t" style="font-weight:500">${esc(f.name)}</div><div class="s">${esc(f.dir)}${f.cached?" · disponible hors ligne":""}</div></div><button class="btn" data-open="${i}">Ouvrir</button></div>`).join(""):`<p class="muted" style="margin:0">Aucun fichier trouvé dans le Drive pour « ${esc(dirName(c))} ».</p>`);
    box.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openFile(L[+b.dataset.open]))};
  if(L)draw(L);
  if(!navigator.onLine||!TOK||Date.now()>TOKEXP){if(!L)draw([], "Touche « Synchro » avec du réseau pour voir les fichiers.");return}
  try{const dn=dirName(c);const folders=await Q(`name='${qe(dn)}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);const out=[];const seen=new Set();
    for(const f of folders){const subs=await Q(`'${f.id}' in parents and trashed=false`);
      for(const s of subs){if(s.mimeType==="application/vnd.google-apps.folder"){const fs=await Q(`'${s.id}' in parents and trashed=false and mimeType!='application/vnd.google-apps.folder'`);fs.forEach(x=>{const k=x.name+"|"+x.size;if(!seen.has(k)){seen.add(k);out.push({id:x.id,name:x.name,dir:s.name,mime:x.mimeType,link:x.webViewLink,mod:x.modifiedTime})}})}
        else{const k=s.name+"|"+s.size;if(!seen.has(k)){seen.add(k);out.push({id:s.id,name:s.name,dir:dn,mime:s.mimeType,link:s.webViewLink,mod:s.modifiedTime})}}}}
    out.sort((a,b)=>String(b.mod).localeCompare(String(a.mod)));
    for(const f of out)f.cached=!!(await pdfGet(f.id));
    await kvSet(key,out);draw(out)}catch(e){draw(L||[],e.message)}}
async function openFile(f){const c=await pdfGet(f.id);
  if(navigator.onLine&&f.link&&TOK&&Date.now()<TOKEXP){window.open(f.link,"_blank","noopener");
    if(!c&&(f.mime==="application/pdf")){try{const b=await (await G("files/"+f.id+"?alt=media")).blob();await pdfSet(f.id,b)}catch(e){}}return}
  if(c){const u=URL.createObjectURL(c);const a=document.createElement("a");a.href=u;a.download=f.name;a.target="_blank";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return}
  toast("Ce fichier n'est pas disponible hors ligne")}

const CF=[["civ","Civilité","sel",["","M.","Mme","M. et Mme","Société"]],["nom","Nom (ou raison sociale)"],["prenom","Prénom"],["prenom2","Prénom de Madame (couple)"],["address","Adresse"],["zip","Code postal","num"],["city","Ville"],["phone","Téléphone 1","tel"],["phone2","Téléphone 2","tel"],["email","E-mail","email"]];
function viewEdit(id){const isNew=!id;const c=isNew?{civ:"",nom:"",prenom:"",address:"",zip:"",city:"",phone:"",email:""}:clientView(id);if(!c){location.hash="/";return}
  head(isNew?"Nouveau prospect":"Modifier la fiche",isNew?"#/":"#/c/"+encodeURIComponent(id));
  $("#app").innerHTML=`<div class="card">${CF.map(([k,l,t,o])=>t==="sel"?`<label class="f">${l}<select id="f_${k}">${o.map(v=>`<option ${c[k]===v?"selected":""} value="${v}">${v||"—"}</option>`).join("")}</select></label>`:`<label class="f">${l}<input id="f_${k}" value="${esc(c[k]||"")}" ${t==="tel"?'type="tel" inputmode="tel"':t==="email"?'type="email" inputmode="email"':t==="num"?'inputmode="numeric" maxlength="5"':""} autocomplete="off"></label>`).join("")}
  <label class="f">Note<textarea id="f_note" placeholder="Ex. : portail code 1234, chien…">${esc(c.mobileNote||"")}</textarea></label>
  <button class="btn primary block" id="save">${isNew?"Créer le prospect":"Enregistrer"}</button><p class="muted" style="font-size:13px">Les modifications sont envoyées à ton appli PC à la prochaine synchro.</p></div>`;
  $("#save").onclick=async()=>{const data={};CF.forEach(([k])=>{const v=$("#f_"+k).value.trim();if(isNew||v!==(c[k]||""))data[k]=v});const note=$("#f_note").value.trim();if(note!==(c.mobileNote||""))data.mobileNote=note;
    if(isNew&&!data.nom&&!data.prenom){toast("Indique au moins un nom");return}
    if(!Object.keys(data).length){location.hash="#/c/"+encodeURIComponent(id);return}
    const cid=isNew?"c_m"+uid():id;if(isNew){data.type="particulier";data.t="client";data.id=cid}
    const o={id:"m_"+uid(),at:Date.now(),kind:"client",clientId:cid,clientDir:dirName({...c,...data}),data,isNew};await outPut(o);OUT=await outAll();
    toast("Enregistré · sera envoyé à la synchro");location.hash="#/c/"+encodeURIComponent(cid);if(navigator.onLine&&TOK&&Date.now()<TOKEXP)sync()}}

/* fiche de découverte */
const VK=[["clim","Climatisation"],["pac","Pompe à chaleur"],["plomb","Plomberie / SDB"],["autre","Autre"]];
function viewVisite(id){const c=clientView(id);if(!c){location.hash="/";return}head("Découverte · "+cName(c),"#/c/"+encodeURIComponent(id));
  const draft=JSON.parse(sessionStorage.getItem("vis_"+id)||"null")||{type:"clim",date:new Date().toISOString().slice(0,10),site:[c.address,c.zip,c.city].filter(Boolean).join(" "),rooms:[{}]};
  const save=()=>sessionStorage.setItem("vis_"+id,JSON.stringify(draft));
  const F=(k,l,t,o)=>t==="sel"?`<label class="f">${l}<select data-k="${k}">${o.map(v=>`<option ${draft[k]===v?"selected":""}>${v}</option>`).join("")}</select></label>`:t==="ta"?`<label class="f">${l}<textarea data-k="${k}">${esc(draft[k]||"")}</textarea></label>`:`<label class="f">${l}<input data-k="${k}" value="${esc(draft[k]||"")}" ${t==="num"?'inputmode="decimal"':t==="date"?'type="date"':""}></label>`;
  const draw=()=>{const T=draft.type;
    $("#app").innerHTML=`<div class="chips">${VK.map(([k,l])=>`<button type="button" class="chip ${T===k?"on":""}" data-t="${k}">${l}</button>`).join("")}</div>
    <div class="card"><h2>Chantier</h2>${F("date","Date de la visite","date")}${F("site","Adresse du chantier")}
      <div class="two">${F("logement","Logement","sel",["","Maison","Appartement","Local pro"])}${F("annee","Année de construction","num")}</div>
      <div class="two">${F("surface","Surface habitable (m²)","num")}${F("occupants","Occupants","num")}</div>
      ${F("plus2ans","Logement de plus de 2 ans","sel",["","Oui","Non"])}</div>
    ${T==="clim"?`<div class="card"><h2>Pièces à équiper</h2><div id="rooms">${draft.rooms.map((r,i)=>`<div class="room"><div class="two"><label class="f">Pièce<input data-r="${i}" data-rk="nom" value="${esc(r.nom||"")}" placeholder="Salon, ch. 1…"></label><label class="f">Surface (m²)<input data-r="${i}" data-rk="surf" value="${esc(r.surf||"")}" inputmode="decimal"></label></div>
        <div class="two"><label class="f">Hauteur (m)<input data-r="${i}" data-rk="h" value="${esc(r.h||"")}" inputmode="decimal"></label><label class="f">Exposition<select data-r="${i}" data-rk="expo">${["","Nord","Est","Sud","Ouest","Sous toiture"].map(v=>`<option ${r.expo===v?"selected":""}>${v}</option>`).join("")}</select></label></div>
        <div class="two"><label class="f">Unité souhaitée<select data-r="${i}" data-rk="ui">${["","Murale","Console","Cassette","Gainable"].map(v=>`<option ${r.ui===v?"selected":""}>${v}</option>`).join("")}</select></label><label class="f">Liaison (m)<input data-r="${i}" data-rk="liaison" value="${esc(r.liaison||"")}" inputmode="decimal"></label></div>
        ${draft.rooms.length>1?`<button type="button" class="btn" data-rdel="${i}">Retirer cette pièce</button>`:""}</div>`).join("")}</div><button type="button" class="btn block" id="addRoom">+ Ajouter une pièce</button></div>
      <div class="card"><h2>Groupe extérieur et réseaux</h2>${F("ext","Emplacement du groupe extérieur","sel",["","Sol","Mural (console)","Toiture terrasse","Balcon"])}${F("condensats","Évacuation des condensats","sel",["","Gravitaire","Pompe de relevage","À définir"])}
        <div class="two">${F("elec","Tableau électrique","sel",["","Place disponible","À modifier","Saturé"])}${F("elecDist","Distance tableau (m)","num")}</div>${F("acces","Accès / hauteur (nacelle, échafaudage…)")}</div>`:""}
    ${T==="pac"?`<div class="card"><h2>Chauffage existant</h2>${F("energie","Énergie actuelle","sel",["","Fioul","Gaz","Électrique","Bois","Autre"])}<div class="two">${F("puissance","Puissance chaudière (kW)","num")}${F("conso","Conso annuelle (L, kWh…)")}</div>
        ${F("emetteurs","Émetteurs","sel",["","Radiateurs fonte","Radiateurs acier","Plancher chauffant","Mixte"])}${F("ecs","Eau chaude sanitaire","sel",["","Par la chaudière","Ballon électrique","Ballon thermodynamique","À prévoir avec la PAC"])}
        ${F("ballon","Volume ballon (L)","num")}${F("extPac","Emplacement unité extérieure")}${F("elecPac","Alimentation électrique (mono/tri, puissance compteur)")}</div>`:""}
    ${T==="plomb"||T==="autre"?`<div class="card"><h2>Besoin</h2>${F("besoin","Description des travaux","ta")}${F("existant","Installation existante","ta")}${F("contraintes","Contraintes (accès, eau, évacuation…)","ta")}</div>`:""}
    <div class="card"><h2>Remarques</h2>${F("remarques","Notes libres, souhaits du client, budget…","ta")}${F("suite","Suite à donner","sel",["","Devis à faire","Rappeler le client","Deuxième visite","Pas de suite"])}</div>
    <button class="btn primary block" id="send">Enregistrer la fiche</button><p class="muted" style="font-size:13px">Pour les photos, utilise le bouton « 📷 Photos » de la fiche client.</p>`;
    document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{draft.type=b.dataset.t;save();draw()});
    document.querySelectorAll("[data-k]").forEach(x=>x.oninput=x.onchange=()=>{draft[x.dataset.k]=x.value;save()});
    document.querySelectorAll("[data-r]").forEach(x=>x.oninput=x.onchange=()=>{draft.rooms[+x.dataset.r][x.dataset.rk]=x.value;save()});
    document.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=()=>{draft.rooms.splice(+b.dataset.rdel,1);save();draw()});
    const ar=$("#addRoom");if(ar)ar.onclick=()=>{draft.rooms.push({});save();draw()};
    $("#send").onclick=async()=>{const data={...draft,typeLabel:(VK.find(v=>v[0]===draft.type)||[])[1]};if(draft.type!=="clim")delete data.rooms;else data.rooms=draft.rooms.filter(r=>Object.values(r).some(Boolean));
      await outPut({id:"m_"+uid(),at:Date.now(),kind:"visite",clientId:id,clientDir:dirName(c),data});OUT=await outAll();sessionStorage.removeItem("vis_"+id);
      toast("Fiche enregistrée · envoyée à la synchro");location.hash="#/c/"+encodeURIComponent(id);if(navigator.onLine&&TOK&&Date.now()<TOKEXP)sync()}};
  draw()}

/* photos */
async function shrink(file){try{const img=await createImageBitmap(file,{imageOrientation:"from-image"});const s=Math.min(1,2000/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",0.82))}catch(e){return file}}
function viewPhotos(id){const c=clientView(id);if(!c){location.hash="/";return}head("Photos · "+cName(c),"#/c/"+encodeURIComponent(id));let P=[];
  const draw=()=>{$("#app").innerHTML=`<div class="card"><div class="btns" style="margin-bottom:12px"><label class="btn primary" style="flex:1">📷 Prendre une photo<input type="file" accept="image/*" capture="environment" id="cam" hidden></label><label class="btn" style="flex:1">🖼 Galerie<input type="file" accept="image/*" multiple id="gal" hidden></label></div>
    ${P.length?`<div class="photos">${P.map((p,i)=>`<div style="position:relative"><img src="${p.url}" alt="Photo ${i+1}"><button class="btn" data-del="${i}" style="position:absolute;top:4px;right:4px;min-height:32px;padding:2px 8px" aria-label="Retirer la photo ${i+1}">✕</button></div>`).join("")}</div>`:`<p class="muted" style="margin:0">Aucune photo pour l'instant.</p>`}
    <label class="f" style="margin-top:12px">Légende (facultatif)<input id="note" placeholder="Ex. : emplacement groupe extérieur"></label>
    <button class="btn primary block" id="send" ${P.length?"":"disabled"}>Ranger ${P.length||""} photo${P.length>1?"s":""} dans le dossier du client</button></div>`;
    const add=async fl=>{for(const f of fl){const b=await shrink(f);P.push({blob:b,url:URL.createObjectURL(b)})}draw()};
    $("#cam").onchange=e=>add(e.target.files);$("#gal").onchange=e=>add(e.target.files);
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{P.splice(+b.dataset.del,1);draw()});
    $("#send").onclick=async()=>{await outPut({id:"m_"+uid(),at:Date.now(),kind:"photos",clientId:id,clientDir:dirName(c),note:$("#note").value.trim(),photos:P.map(p=>({blob:p.blob}))});OUT=await outAll();
      toast(P.length+" photo(s) en attente d'envoi");location.hash="#/c/"+encodeURIComponent(id);if(navigator.onLine&&TOK&&Date.now()<TOKEXP)sync()}};
  draw()}

/* démarrage */
(async()=>{try{DATA=await kvGet("data")||null;META=await kvGet("meta")||null;OUT=await outAll()}catch(e){}route()})();
</script>
